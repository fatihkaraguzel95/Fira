# /etc/nginx/snippets/fira-security-headers.conf
# Included in the HTTPS server block AND in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: app shell is self-hosted; only Google Fonts is external. Inline styles are needed by tiptap/React style props.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://fira.flpconsulting.de wss://fira.flpconsulting.de https://172.22.111.203 wss://172.22.111.203; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
