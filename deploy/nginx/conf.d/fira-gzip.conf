# Fira — sıkıştırma (#68D51B9D)
#
# Ubuntu'nun varsayılan nginx.conf'unda `gzip on;` açık ama `gzip_types` ve
# `gzip_proxied` satırları **yorumda**. Sonuç:
#   • gzip_types varsayılanı `text/html` → JSON ve JS hiç sıkıştırılmıyordu,
#   • gzip_proxied varsayılanı `off`   → /api/ altındaki her şey (PostgREST,
#     storage, auth) vekil cevabı olduğu için zaten sıkıştırılmıyordu.
#
# Ölçüm (23 Eyl 2026): liste sorgusunun cevabı 395 KB gidiyordu; uygulama
# paketi 2,5 MB. Günlük ~7 GB trafiğin büyük kısmı buradan.
#
# Kurulum: /etc/nginx/conf.d/fira-gzip.conf → `sudo nginx -t` → `sudo systemctl reload nginx`
# (Bu dosya http bloğuna girer; conf.d zaten nginx.conf'tan include ediliyor.)

gzip_vary on;
# Vekil cevaplarını da sıkıştır — Fira'nın API'si nginx için "proxied" cevaptır.
gzip_proxied any;
# 5: sıkıştırma oranı ile CPU arasında makul yer (paylaşımlı sunucu).
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/geo+json
    application/javascript
    application/x-javascript
    application/xml
    application/rss+xml
    application/manifest+json
    application/wasm
    font/ttf
    font/otf
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
