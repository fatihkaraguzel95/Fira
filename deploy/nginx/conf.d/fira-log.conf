# Fira — sanal sunucuya özel JSON access log biçimi (http bağlamı; /etc/nginx/conf.d/)
# Kullanım (site dosyasında): access_log /var/log/nginx/fira.access.log fira_json;
# Toplayıcı: deploy/fira-net.sh (dakikada bir, yalnızca yeni satırlar) → public.net_samples / request_errors / request_recent
# Alanlar: zaman (ISO8601), istemci IP, yöntem, yol (sorgu dizisi ayrı), durum, giren/çıkan bayt, süre (ms), UA, referer
log_format fira_json escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","p":"$uri","q":"$args",'
  '"s":$status,"bi":$request_length,"bo":$bytes_sent,"ms":$request_time,'
  '"ua":"$http_user_agent","r":"$http_referer","up":"$upstream_status"}';
