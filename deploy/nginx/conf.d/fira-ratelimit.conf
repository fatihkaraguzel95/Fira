# Fira — oran sınırlama bölgeleri (http bağlamı; /etc/nginx/conf.d/ altına kopyalanır)
#
# Anahtar istemci IP'si. Ofis kullanıcıları tek bir NAT IP'sinden gelir; sınırlar
# "bir kişi" değil "bir ofis" için düşünülmüştür.
#
# Ders (1 Eyl): uygulama hemen her işlemde /auth/v1/user ve token yenilemesi çağırıyor;
# bütün /api/auth/ yolunu dakikada 30 ile sınırlamak normal kullanımı 429'a düşürdü
# (takım listesi kaybolup geri geliyordu). Kaba kuvvet riski olan uçlar yalnızca
# şifreyle giriş, kayıt, şifre sıfırlama ve OTP/magic link; sınır onlara özel.

# Şifreyle giriş: /auth/v1/token?grant_type=password. Anahtar boşsa nginx sınırlamaz —
# yani refresh_token yenilemeleri (grant_type=refresh_token) serbest kalır.
map $arg_grant_type $fira_login_key {
    default   "";
    password  $binary_remote_addr;
}

limit_req_zone $fira_login_key        zone=fira_login:2m  rate=20r/m;   # şifreyle giriş denemeleri
limit_req_zone $binary_remote_addr    zone=fira_signup:2m rate=20r/m;   # kayıt / sıfırlama / otp / magic link
limit_req_zone $binary_remote_addr    zone=fira_auth:2m   rate=600r/m;  # diğer auth (user, token refresh, logout)
limit_req_zone $binary_remote_addr    zone=fira_rest:10m  rate=100r/s;  # PostgREST — tek IP = bütün ofis (2 Eyl 429 fırtınası)
limit_req_zone $binary_remote_addr    zone=fira_store:5m  rate=25r/s;   # storage
limit_req_status 429;
limit_req_log_level warn;

# Realtime: aynı IP'den eş zamanlı WebSocket sayısı (sekme başına 1)
limit_conn_zone $binary_remote_addr zone=fira_ws:2m;
